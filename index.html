<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <title>XO Game</title>
  </head>

  <body>
    <div class="container">
      <div class="scoreboard">
        <div class="round-info">
          <div>Round: <span id="round">1</span></div>
          <small>First to 5 wins</small>
        </div>

        <div class="players-score">
          <div>X Wins: <span id="x-score">0</span></div>
          <div>O Wins: <span id="o-score">0</span></div>
        </div>
      </div>

      <h2 class="game-title">Choose your board size to start the game! 🎮</h2>
      <div class="game-settings">
        <label for="board-size">Board Size :</label>

        <select id="board-size">
          <option value="3">3 × 3</option>
          <option value="4">4 × 4</option>
          <option value="5">5 × 5</option>
          <option value="6">6 × 6</option>
        </select>

        <button id="start">Start Game</button>
      </div>

      <button id="reset">Reset</button>
      <button id="back-home">Back to Home</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
